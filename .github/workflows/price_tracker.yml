name: Samsung S26 Price Tracker

on:
  schedule:
    # Runs once a day at 06:00 UTC. Adjust as you like — cron is UTC, not IST.
    - cron: "0 6 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit tracker_state.json back

jobs:
  check-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run tracker
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python price_tracker.py

      - name: Commit updated state file
        run: |
          git config user.name "price-tracker-bot"
          git config user.email "actions@github.com"
          git add tracker_state.json
          git diff --quiet --cached || git commit -m "Update tracker state [skip ci]"
          git push